name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  verify:
    uses: devsecopslonghn/.github/.github/workflows/node-container.yml@master
    with:
      node_version: "22"
      install_command: npm ci
      quality_command: npm run typecheck
      build_command: npm run build
      image_name: ghcr.io/devsecopslonghn/lol-analysis-frontend
      publish_image: true
      registry: ghcr.io
    secrets: inherit
